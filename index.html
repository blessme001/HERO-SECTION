<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessme - Creative Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0a1628 0%, #1a2f4a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #0a1628 0%, #1a2f4a 100%);
        }

        /* ===== VIDEO BACKGROUND ===== */
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.7;
        }

        /* ===== 3D CANVAS BACKGROUND ===== */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        /* Overlay gradient - Navy/Blue tint */
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(10, 22, 40, 0.3), rgba(10, 22, 40, 0.7));
            z-index: 2;
            pointer-events: none;
        }

        /* ===== FLOWING GRID BACKGROUND ===== */
        .grid-bg {
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 0.3;
        }

        .grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(220, 53, 69, 0.5) 50%, transparent);
            animation: flow-h 8s linear infinite;
        }

        .grid-line.vertical {
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(220, 53, 69, 0.4) 50%, transparent);
            animation: flow-v 8s linear infinite;
        }

        @keyframes flow-h {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes flow-v {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* ===== CONTENT ===== */
        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #fff;
            max-width: 900px;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .announcement {
            display: inline-block;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
        }

        .announcement-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid rgba(220, 53, 69, 0.4);
            border-radius: 8px;
            background: rgba(220, 53, 69, 0.1);
            backdrop-filter: blur(10px);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #ff6b7a;
        }

        .announcement-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6b7a;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin: 2rem 0;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .word {
            display: inline-block;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            margin-right: 0.15em;
        }

        .word:nth-child(1) { animation-delay: 0.3s; }
        .word:nth-child(2) { animation-delay: 0.4s; }
        .word:nth-child(3) { animation-delay: 0.5s; }
        .word:nth-child(4) { animation-delay: 0.6s; }
        .word:nth-child(5) { animation-delay: 0.7s; }

        .gradient-text {
            background: linear-gradient(92.55deg, #ff6b7a 0%, #dc3545 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0) blur(0);
            }
        }

        p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: rgba(248, 248, 248, 0.7);
            line-height: 1.6;
            max-width: 600px;
            margin: 1.5rem auto 2.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.8s forwards;
        }

        /* ===== CTA BUTTONS ===== */
        .cta-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 1s forwards;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: none;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b7a 0%, #dc3545 100%);
            color: #fff;
            box-shadow: 0 8px 32px rgba(220, 53, 69, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(220, 53, 69, 0.5);
            background: linear-gradient(135deg, #ff8494 0%, #e74c56 100%);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #f5f5dc;
            border: 1.5px solid rgba(245, 245, 220, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(220, 53, 69, 0.6);
            color: #ff6b7a;
            box-shadow: 0 8px 32px rgba(220, 53, 69, 0.2);
        }

        /* ===== SCROLL INDICATOR ===== */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .scroll-arrow {
            width: 20px;
            color: rgba(248, 248, 248, 0.5);
            font-size: 24px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <!-- Video Background -->
        <video autoplay muted playsinline class="hero-video">
            <source src="tech-bg-01.mp4" type="video/mp4">
        </video>

        <!-- 3D Canvas Background -->
        <canvas id="canvas-bg"></canvas>

        <!-- Grid Background -->
        <div class="grid-bg" id="grid-bg"></div>

        <!-- Content -->
        <div class="hero-content">
            <div class="announcement">
                <div class="announcement-badge">Now Building With AI</div>
            </div>

            <h1>
                <span class="word">Building</span>
                <span class="word">real-time</span>
                <span class="word">interactive</span>
                <span class="word">experiences,</span>
                <span class="word"><span class="gradient-text">end-to-end</span></span>
            </h1>

            <p>Fullstack developer & creative technologist. I build fast, animated, and interactive web experiences that push the boundaries of what's possible on the web.</p>

            <div class="cta-buttons">
                <button class="btn btn-primary">View My Work</button>
                <button class="btn btn-secondary">Get In Touch</button>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator">
            <span class="scroll-arrow">↓</span>
        </div>
    </section>

    <!-- Three.js for 3D Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP for advanced animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // ===== 3D CANVAS BACKGROUND =====
        const canvas = document.getElementById('canvas-bg');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        camera.position.z = 5;

        // Create particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 1000;
        const positionArray = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positionArray[i] = (Math.random() - 0.5) * 2000;
            positionArray[i + 1] = (Math.random() - 0.5) * 2000;
            positionArray[i + 2] = (Math.random() - 0.5) * 2000;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positionArray, 3));

        // Particle material
        const particlesMaterial = new THREE.PointsMaterial({
            size: 10,
            color: 0xc7c099,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.5
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Mouse position tracking
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Animation loop
        const animate = () => {
            requestAnimationFrame(animate);

            particles.rotation.x += 0.0001;
            particles.rotation.y += 0.0002;
            particles.position.x = mouseX * 50;
            particles.position.y = mouseY * 50;

            renderer.render(scene, camera);
        };

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== GENERATE GRID LINES =====
        function generateGrid() {
            const gridBg = document.getElementById('grid-bg');
            const spacing = window.innerWidth / 8;

            // Vertical lines
            for (let i = 0; i < 8; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line vertical';
                line.style.left = (i * spacing) + 'px';
                line.style.animationDelay = (i * 0.1) + 's';
                gridBg.appendChild(line);
            }

            // Horizontal lines
            for (let i = 0; i < 5; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line';
                line.style.top = ((i + 1) * 20) + '%';
                line.style.width = '100%';
                line.style.animationDelay = (i * 0.2) + 's';
                gridBg.appendChild(line);
            }
        }

        generateGrid();

        // ===== GSAP TEXT ANIMATIONS =====
        gsap.from('.announcement', {
            opacity: 0,
            y: 20,
            duration: 0.8,
            delay: 0.2
        });

        gsap.from('.word', {
            opacity: 0,
            y: 30,
            blur: 10,
            stagger: 0.1,
            duration: 0.6,
            ease: 'power2.out'
        });

        gsap.from('p', {
            opacity: 0,
            y: 20,
            duration: 0.8,
            delay: 0.8
        });

        gsap.from('.cta-buttons', {
            opacity: 0,
            y: 20,
            duration: 0.8,
            delay: 1
        });

        // ===== SCROLL INDICATOR CLICK =====
        document.querySelector('.scroll-indicator').addEventListener('click', () => {
            window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
        });

        // Hide scroll indicator on scroll
        window.addEventListener('scroll', () => {
            const indicator = document.querySelector('.scroll-indicator');
            if (window.scrollY > 100) {
                indicator.style.opacity = '0';
                indicator.style.pointerEvents = 'none';
            } else {
                indicator.style.opacity = '1';
                indicator.style.pointerEvents = 'auto';
            }
        });

        // ===== VIDEO SWITCHING =====
        let currentVideo = 1;
        const heroVideo = document.querySelector('.hero-video');

        heroVideo.addEventListener('ended', () => {
            currentVideo = currentVideo === 1 ? 2 : 1;
            const newSrc = `tech-bg-0${currentVideo}.mp4`;
            heroVideo.innerHTML = `<source src="${newSrc}" type="video/mp4">`;
            heroVideo.load();
            heroVideo.play();
        });
    </script>
</body>
</html>
